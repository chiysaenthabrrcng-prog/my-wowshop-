<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOWSHOP - Store 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap');
        :root { --red:#ef4444; --bg:#0b0e14; --surface:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.07); }
        body { font-family:'Kanit',sans-serif; background:var(--bg); color:#e6edf3; margin:0; overflow-x:hidden; }
        .glass { background:var(--surface); backdrop-filter:blur(20px); border:1px solid var(--border); }
        #sidebar { position:fixed; inset:y-0; right:0; width:280px; background:#0b0e14; z-index:200; transform:translateX(100%); transition:0.3s; padding:24px; border-left:1px solid var(--border); }
        #sidebar.active { transform:translateX(0); }
        .section-room { display:none; }
        .section-room.active { display:block; animation:fadeIn .3s; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .modal-bg { display:none; position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); align-items:center; justify-content:center; }
        .modal-bg.active { display:flex; }
        .sold-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; border-radius:1rem; }
        #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:999; padding:12px 24px; border-radius:12px; opacity:0; transition:0.3s; pointer-events:none; }
        #toast.show { opacity:1; }
    </style>
</head>
<body>

<nav class="fixed w-full z-[100] px-4 py-4 glass flex justify-between items-center">
    <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
        <img src="1000014994.png" class="w-10 h-10 rounded-xl" onerror="this.src='https://placehold.co/40x40/ef4444/white?text=W'">
        <span class="text-xl font-black text-white uppercase">WOW<span class="text-red-500">SHOP</span></span>
    </div>
    <div class="flex items-center gap-2">
        <div id="nav-points" class="hidden glass px-3 py-2 rounded-xl text-red-400 font-bold"><span id="user-money">0.00</span> ฿</div>
        <button id="nav-login-btn" onclick="openModal('auth-modal')" class="bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase">เข้าสู่ระบบ</button>
        <button onclick="toggleSidebar()" class="text-white bg-white/10 px-3 py-2 rounded-xl"><i class="fas fa-bars"></i></button>
    </div>
</nav>

<div id="sidebar">
    <div class="flex justify-between items-center mb-10 text-red-500 font-black uppercase">Menu <button onclick="toggleSidebar()" class="text-2xl text-gray-500">&times;</button></div>
    <div class="space-y-2">
        <button onclick="changeRoom('home')" class="w-full text-left p-4 hover:bg-white/5 rounded-2xl flex items-center gap-4 text-white/70"><i class="fas fa-home"></i> หน้าแรก</button>
        <button onclick="checkAccess('topup')" class="w-full text-left p-4 hover:bg-white/5 rounded-2xl flex items-center gap-4 text-white/70"><i class="fas fa-wallet"></i> เติมเงิน</button>
        <button onclick="checkAccess('history')" class="w-full text-left p-4 hover:bg-white/5 rounded-2xl flex items-center gap-4 text-white/70"><i class="fas fa-history"></i> ประวัติการซื้อ</button>
        <div id="sidebar-admin" class="hidden border-t border-white/10 pt-4">
            <button onclick="changeRoom('admin')" class="w-full text-left p-4 bg-red-600/10 text-red-500 rounded-2xl flex items-center gap-4 font-black"><i class="fas fa-user-shield"></i> แผงแอดมิน</button>
        </div>
        <button id="sidebar-logout" onclick="doLogout()" class="hidden w-full text-left p-4 text-gray-500 flex items-center gap-4"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
    </div>
</div>
<div id="sidebar-overlay" class="hidden fixed inset-0 z-[190] bg-black/50" onclick="toggleSidebar()"></div>

<main id="room-home" class="section-room active pt-24 px-4 max-w-7xl mx-auto pb-10">
    <div id="product-list" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
</main>

<main id="room-admin" class="section-room pt-24 px-4 max-w-4xl mx-auto pb-10">
    <h2 class="text-2xl font-black text-red-500 mb-6 uppercase italic">Admin Dashboard</h2>
    <div class="glass p-6 rounded-3xl mb-8">
        <input type="text" id="p-name" placeholder="ชื่อสินค้า" class="w-full p-3 rounded-xl mb-3 bg-white/5 border border-white/10 text-white">
        <input type="number" id="p-price" placeholder="ราคา (฿)" class="w-full p-3 rounded-xl mb-3 bg-white/5 border border-white/10 text-white">
        <input type="text" id="p-img" placeholder="ลิงก์รูปภาพ" class="w-full p-3 rounded-xl mb-3 bg-white/5 border border-white/10 text-white">
        <textarea id="p-acc" placeholder="รหัสไอดี (1 บรรทัด = 1 ไอดี)" class="w-full p-3 rounded-xl mb-4 h-24 bg-white/5 border border-white/10 text-white"></textarea>
        <button onclick="addProduct()" class="w-full py-3 bg-green-500 text-white rounded-xl font-black uppercase">บันทึกลงฐานข้อมูล</button>
    </div>
    <div id="admin-list" class="space-y-2"></div>
</main>

<main id="room-history" class="section-room pt-24 px-4 max-w-4xl mx-auto pb-10">
    <h2 class="text-2xl font-black mb-6 uppercase italic">My Orders</h2>
    <div id="history-list" class="space-y-4"></div>
</main>

<main id="room-topup" class="section-room pt-24 px-4 max-w-lg mx-auto pb-10 text-center">
    <div class="glass p-8 rounded-[2.5rem]">
        <h2 class="text-2xl font-black mb-6 uppercase text-red-500">Topup Money</h2>
        <input type="text" id="gift-url" placeholder="วางลิงก์อั่งเปาที่นี่..." class="w-full p-4 rounded-2xl mb-4 text-center bg-white/5 border border-white/10 text-white">
        <button onclick="handleTopup()" class="w-full py-4 bg-red-500 text-white rounded-2xl font-black">ยืนยันการเติมเงิน</button>
    </div>
</main>

<div id="auth-modal" class="modal-bg">
    <div class="glass w-full max-w-sm p-8 rounded-[2.5rem] text-center relative">
        <button onclick="closeModal('auth-modal')" class="absolute top-5 right-6 text-2xl text-gray-500">&times;</button>
        <h2 class="text-2xl font-black text-red-500 mb-6 uppercase italic">Admin Login</h2>
        <input type="text" id="login-user" placeholder="Username" class="w-full p-4 rounded-2xl mb-3 text-center bg-white/5 border border-white/10 text-white">
        <input type="password" id="login-pass" placeholder="Password" class="w-full p-4 rounded-2xl mb-4 text-center bg-white/5 border border-white/10 text-white">
        <button onclick="doLogin()" class="w-full py-4 bg-red-500 text-white rounded-2xl font-black uppercase">ตกลง</button>
    </div>
</div>

<div id="buy-modal" class="modal-bg">
    <div class="glass w-full max-w-lg p-8 rounded-[2.5rem] text-center relative">
        <button onclick="closeModal('buy-modal')" class="absolute top-5 right-6 text-2xl text-gray-500">&times;</button>
        <img id="buy-img" class="w-full aspect-video object-cover rounded-2xl mb-4">
        <h2 id="buy-name" class="text-2xl font-black mb-2 text-white"></h2>
        <div id="buy-price" class="text-3xl font-black text-red-500 mb-6"></div>
        <button id="buy-confirm-btn" class="w-full py-4 bg-red-500 text-white rounded-2xl font-black uppercase">ชำระเงินทันที</button>
    </div>
</div>

<div id="toast" class="bg-red-500 text-white font-bold"></div>

<script>
// --- 1. FIREBASE SETUP ---
const firebaseConfig = {
  apiKey: "AIzaSyAKCOW7uAJowXhpCUlaW3G",
  authDomain: "wowshop-498d9.firebaseapp.com",
  projectId: "wowshop-498d9",
  storageBucket: "wowshop-498d9.firebasestorage.app",
  messagingSenderId: "534483125591",
  appId: "1:534483125591:web:d0171b503",
  databaseURL: "https://wowshop-498d9-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// --- 2. GLOBAL STATE ---
let store = { products: [], orders: [] };
let user = JSON.parse(localStorage.getItem('wow_user')) || null;

// --- 3. CORE ENGINE ---
db.ref('wow_store_v7').on('value', snap => {
    const data = snap.val();
    if(data) { store = data; }
    renderAll();
});

function sync() { db.ref('wow_store_v7').set(store); }

function renderAll() {
    // Render Products
    const list = document.getElementById('product-list');
    list.innerHTML = (store.products || []).map(p => `
        <div class="product-card glass p-3 rounded-[2rem] relative" onclick="openBuy(${p.id})">
            ${p.stock <= 0 ? '<div class="sold-overlay">หมดแล้ว</div>' : ''}
            <img src="${p.img}" class="w-full aspect-square object-cover rounded-2xl mb-3">
            <h4 class="text-xs font-bold truncate text-white">${p.name}</h4>
            <span class="text-sm font-black text-red-400">${p.price} ฿</span>
        </div>`).join('');

    // Render Admin List
    const adm = document.getElementById('admin-list');
    adm.innerHTML = (store.products || []).map(p => `
        <div class="glass p-4 rounded-xl flex justify-between items-center">
            <span class="text-sm text-white">${p.name} (${p.stock})</span>
            <button onclick="delProduct(${p.id})" class="text-red-500"><i class="fas fa-trash"></i></button>
        </div>`).join('');

    // Update UI Elements
    const navLogin = document.getElementById('nav-login-btn');
    const navPoints = document.getElementById('nav-points');
    const sideAdmin = document.getElementById('sidebar-admin');
    const sideLogout = document.getElementById('sidebar-logout');

    if(user) {
        navLogin.style.display = 'none';
        navPoints.style.display = 'block';
        document.getElementById('user-money').textContent = user.points.toFixed(2);
        sideLogout.style.display = 'block';
        sideAdmin.style.display = (user.name === 'wow11') ? 'block' : 'none';
    } else {
        navLogin.style.display = 'block';
        navPoints.style.display = 'none';
        sideAdmin.style.display = 'none';
        sideLogout.style.display = 'none';
    }
}

// --- 4. ACTIONS ---
function doLogin() {
    const u = document.getElementById('login-user').value;
    const p = document.getElementById('login-pass').value;
    if(!u || !p) return msg('กรุณากรอกข้อมูล');

    if(u === 'wow11' && p === '123123z') {
        user = { name: u, points: 999999, isAdmin: true };
    } else {
        user = { name: u, points: 0, isAdmin: false };
    }
    localStorage.setItem('wow_user', JSON.stringify(user));
    renderAll();
    closeModal('auth-modal');
    msg('ยินดีต้อนรับ!', 'bg-green-500');
}

function doLogout() {
    localStorage.removeItem('wow_user');
    user = null;
    renderAll();
    changeRoom('home');
    msg('ออกจากระบบแล้ว');
}

function addProduct() {
    const name = document.getElementById('p-name').value;
    const price = parseInt(document.getElementById('p-price').value);
    const img = document.getElementById('p-img').value;
    const accs = document.getElementById('p-acc').value.split('\n').filter(x => x.trim() !== '');

    if(!name || !price || accs.length === 0) return msg('ข้อมูลไม่ครบ');
    if(!store.products) store.products = [];
    
    store.products.push({ id: Date.now(), name, price, img, accounts: accs, stock: accs.length });
    sync();
    msg('เพิ่มสินค้าสำเร็จ!', 'bg-green-500');
    document.getElementById('p-name').value = '';
    document.getElementById('p-price').value = '';
    document.getElementById('p-img').value = '';
    document.getElementById('p-acc').value = '';
}

function delProduct(id) {
    if(confirm('ลบสินค้านี้?')) {
        store.products = store.products.filter(x => x.id != id);
        sync();
    }
}

function openBuy(id) {
    const p = store.products.find(x => x.id == id);
    if(!p || p.stock <= 0) return;
    document.getElementById('buy-img').src = p.img;
    document.getElementById('buy-name').textContent = p.name;
    document.getElementById('buy-price').textContent = p.price + " ฿";
    document.getElementById('buy-confirm-btn').onclick = () => confirmBuy(p);
    openModal('buy-modal');
}

function confirmBuy(p) {
    if(!user) return openModal('auth-modal');
    if(user.points < p.price) return msg('เงินไม่พอครับ');

    const item = p.accounts.shift();
    p.stock = p.accounts.length;
    user.points -= p.price;
    localStorage.setItem('wow_user', JSON.stringify(user));

    if(!store.orders) store.orders = [];
    store.orders.push({ buyer: user.name, name: p.name, data: item, date: new Date().toLocaleString() });
    
    sync();
    renderAll();
    closeModal('buy-modal');
    msg('ซื้อสำเร็จ! ดูรหัสได้ที่ประวัติ', 'bg-green-500');
}

function renderHistory() {
    if(!user) return;
    const mine = (store.orders || []).filter(x => x.buyer === user.name);
    const el = document.getElementById('history-list');
    if(mine.length === 0) el.innerHTML = '<div class="text-center text-white/20 py-20 italic">ยังไม่มีประวัติการซื้อ</div>';
    else el.innerHTML = mine.reverse().map(h => `
        <div class="glass p-5 rounded-2xl border-l-4 border-red-500">
            <div class="text-white font-bold text-lg">${h.name}</div>
            <div class="text-xs text-white/30 mb-3">${h.date}</div>
            <div class="bg-black/50 p-3 rounded-xl font-mono text-green-400 break-all border border-white/5">${h.data}</div>
        </div>`).join('');
}

function handleTopup() {
    if(!user) return openModal('auth-modal');
    const url = document.getElementById('gift-url').value;
    if(!url.includes('gift.truemoney.com')) return msg('ลิงก์ไม่ถูกต้อง');
    user.points += 500;
    localStorage.setItem('wow_user', JSON.stringify(user));
    renderAll();
    msg('เติมเงินสำเร็จ +500 ฿', 'bg-green-500');
    document.getElementById('gift-url').value = '';
    changeRoom('home');
}

// --- 5. UTILS ---
function toggleSidebar() { 
    document.getElementById('sidebar').classList.toggle('active');
    document.getElementById('sidebar-overlay').classList.toggle('hidden');
}
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function changeRoom(id) {
    document.querySelectorAll('.section-room').forEach(r => r.classList.remove('active'));
    document.getElementById('room-'+id).classList.add('active');
    if(id === 'history') renderHistory();
    toggleSidebar();
}
function checkAccess(room) { if(!user) openModal('auth-modal'); else changeRoom(room); }
function msg(m, color = 'bg-red-500') { 
    const t = document.getElementById('toast'); t.textContent = m; 
    t.className = `${color} show`; setTimeout(() => t.className = '', 3000); 
}
</script>
</body>
</html>
