<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOWSHOP - Premium ID Store 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap');
        :root { --red:#ef4444; --bg:#0b0e14; --surface:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.07); }
        body { font-family:'Kanit',sans-serif; background:var(--bg); color:#e6edf3; margin:0; overflow-x:hidden; }
        .glass { background:var(--surface); backdrop-filter:blur(20px); border:1px solid var(--border); }
        #sidebar { position:fixed; inset-y:0; right:0; width:280px; background:rgba(11,14,20,0.98); z-index:200; transform:translateX(100%); transition:0.3s cubic-bezier(0.4, 0, 0.2, 1); padding:24px; border-left:1px solid var(--border); }
        #sidebar.active { transform:translateX(0); }
        .section-room { display:none; }
        .section-room.active { display:block; animation:fadeIn .3s; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        .category-btn { transition:0.2s; white-space:nowrap; }
        .category-btn.active { background:var(--red); color:white; box-shadow:0 0 15px rgba(239,68,68,0.4); }
        .product-card { transition:0.3s; cursor:pointer; }
        .product-card:hover { transform:translateY(-5px); border-color:rgba(239,68,68,0.5); }
        .sold-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; color:white; font-weight:900; border-radius:1.5rem; z-index:10; }
        #toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px); z-index:9999; padding:14px 28px; border-radius:16px; opacity:0; transition:0.3s; pointer-events:none; }
        #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .admin-tab.active { background:rgba(239,68,68,0.1); color:#f87171; border-color:rgba(239,68,68,0.3); }
        .ticker-track { display:inline-flex; animation:ticker 30s linear infinite; white-space:nowrap; }
        @keyframes ticker { from{transform:translateX(0)} to{transform:translateX(-50%)} }
    </style>
</head>
<body>

<nav class="fixed w-full z-[100] px-4 md:px-6 py-4 glass flex justify-between items-center">
    <div class="flex items-center gap-3 cursor-pointer" onclick="changeRoom('home')">
        <img src="1000014994.png" class="w-10 h-10 rounded-xl shadow-lg shadow-red-600/20" onerror="this.src='https://placehold.co/40x40/ef4444/white?text=W'">
        <div class="flex flex-col leading-tight">
            <span class="text-xl md:text-2xl font-black text-white uppercase">WOW<span class="text-red-500">SHOP</span></span>
            <span class="text-[9px] text-gray-500 font-bold tracking-widest uppercase italic">Premium Store</span>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <div id="ui-points-panel" class="hidden glass px-3 py-2 rounded-xl text-red-400 font-bold items-center gap-1">
            <i class="fas fa-coins text-yellow-500 text-xs"></i> <span id="ui-points-val">0.00</span> ฿
        </div>
        <button id="ui-login-btn" onclick="openModal('auth-modal')" class="bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase shadow-lg">เข้าสู่ระบบ</button>
        <button onclick="toggleSidebar()" class="text-white bg-white/10 px-3 py-2 rounded-xl hover:bg-white/20 transition"><i class="fas fa-bars"></i></button>
    </div>
</nav>

<div id="sidebar">
    <div class="flex justify-between items-center mb-10 text-red-500 font-black">MENU <button onclick="toggleSidebar()" class="text-3xl text-gray-500">&times;</button></div>
    <nav class="space-y-1">
        <button onclick="changeRoom('home')" class="w-full text-left p-4 hover:bg-white/5 rounded-2xl flex items-center gap-4 text-white/70"><i class="fas fa-home text-red-500"></i> หน้าแรก</button>
        <button onclick="checkAccess('topup')" class="w-full text-left p-4 hover:bg-white/5 rounded-2xl flex items-center gap-4 text-white/70"><i class="fas fa-wallet text-orange-500"></i> เติมเงิน</button>
        <button onclick="checkAccess('history')" class="w-full text-left p-4 hover:bg-white/5 rounded-2xl flex items-center gap-4 text-white/70"><i class="fas fa-history text-blue-400"></i> ประวัติการซื้อ</button>
        
        <div id="ui-admin-link" class="hidden border-t border-white/10 mt-4 pt-4">
            <button onclick="changeRoom('admin')" class="w-full text-left p-4 bg-red-600/10 text-red-500 rounded-2xl flex items-center gap-4 font-black"><i class="fas fa-user-shield"></i> แผงแอดมิน</button>
        </div>
        
        <button id="ui-logout-btn" onclick="doLogout()" class="hidden w-full text-left p-4 text-gray-500 flex items-center gap-4 mt-2"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
    </nav>
</div>
<div id="sidebar-overlay" class="hidden fixed inset-0 z-[190] bg-black/60 backdrop-blur-sm" onclick="toggleSidebar()"></div>

<div class="pt-20">
    <div class="ticker-wrap overflow-hidden py-2.5 bg-red-500/5 text-red-400 text-xs font-bold border-b border-white/5">
        <div class="ticker-track" id="ticker-text"></div>
    </div>
</div>

<main id="room-home" class="section-room active max-w-7xl mx-auto p-4 md:p-6 pb-20">
    <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar" id="cat-bar">
        <button onclick="filterCat('all')" class="category-btn active px-6 py-2.5 rounded-xl text-xs font-bold glass">ทั้งหมด</button>
        <button onclick="filterCat('freefire')" class="category-btn px-6 py-2.5 rounded-xl text-xs font-bold glass">Free Fire</button>
        <button onclick="filterCat('rov')" class="category-btn px-6 py-2.5 rounded-xl text-xs font-bold glass">ROV</button>
    </div>
    <div id="product-list" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6"></div>
</main>

<main id="room-admin" class="section-room max-w-6xl mx-auto p-4 md:p-6 pt-10 pb-20">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
        <div class="glass p-4 rounded-2xl"><p class="text-[10px] text-white/40 uppercase mb-1">สินค้าทั้งหมด</p><p id="stat-p" class="text-xl font-black text-red-500">0</p></div>
        <div class="glass p-4 rounded-2xl"><p class="text-[10px] text-white/40 uppercase mb-1">ออเดอร์รวม</p><p id="stat-o" class="text-xl font-black text-blue-400">0</p></div>
    </div>

    <div class="glass p-6 rounded-[2rem] mb-10 border-red-500/20">
        <h3 class="font-black mb-6 text-red-500 uppercase italic"><i class="fas fa-plus-circle mr-2"></i>เพิ่มสินค้าใหม่</h3>
        <div class="grid md:grid-cols-2 gap-4 mb-4">
            <input type="text" id="pm-name" placeholder="ชื่อสินค้า" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 text-white">
            <input type="number" id="pm-price" placeholder="ราคา (฿)" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 text-white">
        </div>
        <input type="text" id="pm-img" placeholder="ลิงก์รูปภาพสินค้า" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 text-white mb-4">
        <textarea id="pm-acc" placeholder="รหัสไอดี (1 บรรทัด = 1 ไอดี)" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 text-white h-32 mb-6 font-mono"></textarea>
        <button onclick="saveProduct()" class="w-full py-4 bg-green-500 text-white rounded-2xl font-black uppercase shadow-lg shadow-green-900/20 hover:brightness-110 transition">บันทึกข้อมูลสินค้า</button>
    </div>
    <div id="admin-product-list" class="space-y-3"></div>
</main>

<main id="room-history" class="section-room max-w-4xl mx-auto p-4 md:p-6 pt-10">
    <h2 class="text-2xl font-black mb-6 uppercase italic border-l-4 border-red-500 pl-4">ประวัติการซื้อ</h2>
    <div id="history-content" class="space-y-4"></div>
</main>

<main id="room-topup" class="section-room max-w-lg mx-auto p-6 pt-10 text-center">
    <div class="glass p-10 rounded-[3rem] border-orange-500/20">
        <div class="w-16 h-16 bg-orange-500/10 rounded-2xl flex items-center justify-center mx-auto mb-6"><i class="fas fa-wallet text-orange-500 text-2xl"></i></div>
        <h2 class="text-2xl font-black mb-6 uppercase italic text-white">เติมเงินอั่งเปา</h2>
        <input type="text" id="topup-url" placeholder="https://gift.truemoney.com/..." class="w-full p-4 rounded-2xl mb-6 text-center bg-white/5 border border-white/10 text-white">
        <button onclick="handleTopup()" class="w-full py-4 bg-gradient-to-r from-red-600 to-red-800 text-white rounded-2xl font-black uppercase shadow-xl">ยืนยันการเติมเงิน</button>
    </div>
</main>

<div id="auth-modal" class="modal-bg">
    <div class="glass w-full max-w-sm p-10 rounded-[3rem] text-center relative">
        <button onclick="closeModal('auth-modal')" class="absolute top-6 right-8 text-2xl text-gray-500 hover:text-white">&times;</button>
        <h2 class="text-3xl font-black text-red-500 mb-8 uppercase italic">Login</h2>
        <input type="text" id="auth-u" placeholder="ชื่อผู้ใช้งาน" class="w-full p-4 rounded-2xl mb-3 text-center bg-white/5 border border-white/10 text-white">
        <input type="password" id="auth-p" placeholder="รหัสผ่าน" class="w-full p-4 rounded-2xl mb-6 text-center bg-white/5 border border-white/10 text-white">
        <button onclick="doLogin()" class="w-full py-4 bg-red-500 text-white rounded-2xl font-black uppercase shadow-lg">เข้าสู่ระบบ</button>
    </div>
</div>

<div id="detail-modal" class="modal-bg">
    <div class="glass w-full max-w-lg p-8 rounded-[3rem] relative text-center">
        <button onclick="closeModal('detail-modal')" class="absolute top-6 right-8 text-2xl text-gray-500 hover:text-white">&times;</button>
        <img id="det-img" src="" class="w-full aspect-square object-cover rounded-[2rem] mb-6 shadow-2xl">
        <h2 id="det-name" class="text-2xl font-black mb-2 uppercase text-white"></h2>
        <div id="det-price" class="text-4xl font-black text-red-500 mb-8"></div>
        <button id="buy-confirm-btn" class="w-full py-5 bg-red-500 text-white rounded-2xl font-black uppercase shadow-xl hover:scale-[1.02] transition">ชำระเงินทันที</button>
    </div>
</div>

<div id="toast" class="bg-red-500 text-white font-bold text-sm shadow-2xl"></div>

<script>
// 1. CONFIG (Firebase ของแอดมินเป๊ะๆ)
const firebaseConfig = {
  apiKey: "AIzaSyAKCOW7uAJowXhpCUlaW3G",
  authDomain: "wowshop-498d9.firebaseapp.com",
  projectId: "wowshop-498d9",
  storageBucket: "wowshop-498d9.firebasestorage.app",
  messagingSenderId: "534483125591",
  appId: "1:534483125591:web:d0171b503",
  databaseURL: "https://wowshop-498d9-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 2. STATE
let store = { products: [], orders: [] };
let user = JSON.parse(localStorage.getItem('wow_user')) || null;
let currentCategory = 'all';

// 3. SYNC REALTIME
db.ref('wowshop_v8_final').on('value', snap => {
    const data = snap.val();
    if(data) { store = data; }
    renderAll();
});
function sync() { db.ref('wowshop_v8_final').set(store); }

// 4. CORE UI FUNCTIONS
function renderAll() {
    renderProducts();
    updateAuthUI();
    renderHistory();
    document.getElementById('stat-p').textContent = (store.products || []).length;
    document.getElementById('stat-o').textContent = (store.orders || []).length;
    document.getElementById('ticker-text').innerHTML = `<span class="px-10">💎 WOWSHOP บริการขายไอดีเกม 24 ชม. ปลอดภัย มั่นใจได้ 100%</span>`.repeat(10);
}

function renderProducts() {
    const list = document.getElementById('product-list');
    let items = store.products || [];
    if(currentCategory !== 'all') items = items.filter(p => p.cat === currentCategory);
    
    list.innerHTML = items.map(p => `
        <div class="product-card glass p-3 rounded-[2.5rem] relative" onclick="openDetail('${p.id}')">
            ${p.stock <= 0 ? '<div class="sold-overlay">SOLD OUT</div>' : ''}
            <img src="${p.img}" class="w-full aspect-square object-cover rounded-[2rem] mb-4 shadow-lg">
            <h4 class="text-[13px] font-bold truncate text-white px-2 mb-1">${p.name}</h4>
            <div class="flex justify-between items-center px-2">
                <span class="text-sm font-black text-red-500">${p.price}฿</span>
                <span class="text-[9px] text-white/20 uppercase font-black tracking-widest">${p.cat || 'Game'}</span>
            </div>
        </div>`).join('');

    const adm = document.getElementById('admin-product-list');
    adm.innerHTML = (store.products || []).map(p => `
        <div class="glass p-5 rounded-2xl flex justify-between items-center border-white/5">
            <div><span class="text-white font-bold">${p.name}</span> <span class="text-xs text-white/30 ml-2">(คลัง: ${p.stock})</span></div>
            <button onclick="delProduct('${p.id}')" class="text-red-500 bg-red-500/10 w-10 h-10 rounded-xl hover:bg-red-500 hover:text-white transition"><i class="fas fa-trash"></i></button>
        </div>`).join('');
}

function openDetail(id) {
    const p = store.products.find(x => x.id == id);
    if(!p || p.stock <= 0) return;
    document.getElementById('det-img').src = p.img;
    document.getElementById('det-name').textContent = p.name;
    document.getElementById('det-price').textContent = p.price + " ฿";
    document.getElementById('buy-confirm-btn').onclick = () => confirmBuy(p);
    openModal('detail-modal');
}

// 5. ACTION FUNCTIONS
function doLogin() {
    const u = document.getElementById('auth-u').value;
    const p = document.getElementById('auth-p').value;
    if(!u || !p) return msg('กรุณากรอกข้อมูล');
    user = { name: u, points: (u === 'wow11' && p === '123123z') ? 999999 : 0, isAdmin: (u === 'wow11' && p === '123123z') };
    localStorage.setItem('wow_user', JSON.stringify(user));
    renderAll();
    closeModal('auth-modal');
    msg('สำเร็จ!', 'bg-green-500');
}

function doLogout() { localStorage.removeItem('wow_user'); user = null; renderAll(); changeRoom('home'); msg('ออกจากระบบ'); }

function updateAuthUI() {
    const loginBtn = document.getElementById('ui-login-btn');
    const pointsPanel = document.getElementById('ui-points-panel');
    const adminLink = document.getElementById('ui-admin-link');
    const logoutBtn = document.getElementById('ui-logout-btn');

    if(user) {
        loginBtn.style.display = 'none';
        pointsPanel.style.display = 'flex';
        document.getElementById('ui-points-val').textContent = user.points.toFixed(2);
        logoutBtn.style.display = 'block';
        adminLink.style.display = user.isAdmin ? 'block' : 'none';
    } else {
        loginBtn.style.display = 'block';
        pointsPanel.style.display = 'none';
        adminLink.style.display = 'none';
        logoutBtn.style.display = 'none';
    }
}

function saveProduct() {
    const name = document.getElementById('pm-name').value;
    const price = parseInt(document.getElementById('pm-price').value);
    const img = document.getElementById('pm-img').value;
    const accs = document.getElementById('pm-acc').value.split('\n').filter(x => x.trim() !== '');
    if(!name || !price || accs.length === 0) return msg('กรอกไม่ครบ');
    if(!store.products) store.products = [];
    store.products.push({ id: Date.now(), name, price, img, accounts: accs, stock: accs.length, cat: 'Game' });
    sync();
    msg('ลงสินค้าแล้ว', 'bg-green-500');
    document.getElementById('pm-name').value = ''; document.getElementById('pm-price').value = ''; document.getElementById('pm-img').value = ''; document.getElementById('pm-acc').value = '';
}

function delProduct(id) { if(confirm('ลบ?')) { store.products = store.products.filter(x => x.id != id); sync(); } }

function confirmBuy(p) {
    if(!user) return openModal('auth-modal');
    if(user.points < p.price) return msg('เงินไม่พอ');
    const item = p.accounts.shift();
    p.stock = p.accounts.length;
    user.points -= p.price;
    localStorage.setItem('wow_user', JSON.stringify(user));
    if(!store.orders) store.orders = [];
    store.orders.push({ buyer: user.name, name: p.name, data: item, date: new Date().toLocaleString() });
    sync(); renderAll(); closeModal('detail-modal'); changeRoom('history'); msg('ซื้อสำเร็จ!', 'bg-green-500');
}

function renderHistory() {
    if(!user) return;
    const mine = (store.orders || []).filter(x => x.buyer === user.name);
    const el = document.getElementById('history-content');
    if(mine.length === 0) el.innerHTML = '<div class="text-center text-white/10 py-20 italic">ไม่มีประวัติ</div>';
    else el.innerHTML = mine.reverse().map(h => `<div class="glass p-5 rounded-3xl border-l-4 border-red-500"><div class="text-white font-bold">${h.name}</div><div class="text-[10px] text-white/20 mb-3">${h.date}</div><div class="bg-black/50 p-3 rounded-xl font-mono text-xs text-green-400 border border-white/5 break-all">${h.data}</div></div>`).join('');
}

function handleTopup() {
    if(!user) return openModal('auth-modal');
    if(!document.getElementById('topup-url').value.includes('gift.truemoney.com')) return msg('ลิงก์ผิด');
    user.points += 500;
    localStorage.setItem('wow_user', JSON.stringify(user));
    renderAll(); msg('เติมแล้ว +500', 'bg-green-500');
    document.getElementById('topup-url').value = ''; changeRoom('home');
}

// 6. HELPERS
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); }
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function changeRoom(id) {
    document.querySelectorAll('.section-room').forEach(r => r.classList.remove('active'));
    document.getElementById('room-'+id).classList.add('active');
    document.getElementById('sidebar').classList.remove('active');
    document.getElementById('sidebar-overlay').classList.add('hidden');
    window.scrollTo(0,0);
}
function filterCat(c) {
    currentCategory = c;
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderProducts();
}
function checkAccess(room) { if(!user) openModal('auth-modal'); else changeRoom(room); }
function msg(m, cls='bg-red-500') { const t=document.getElementById('toast'); t.textContent=m; t.className=cls+' show px-6 py-3 rounded-2xl fixed'; setTimeout(()=>t.className='', 3000); }

renderAll();
</script>
</body>
</html>
