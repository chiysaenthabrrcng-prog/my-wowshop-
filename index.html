<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOWSHOP - Premium Store 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap');
        :root { --red:#ef4444; --bg:#0b0e14; --surface:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.07); }
        body { font-family:'Kanit',sans-serif; background:var(--bg); color:#e6edf3; margin:0; overflow-x:hidden; }
        .glass { background:var(--surface); backdrop-filter:blur(20px); border:1px solid var(--border); }
        .section-room { display:none; animation:fadeIn .3s; }
        .section-room.active { display:block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .btn-red { background:linear-gradient(135deg,#ef4444,#b91c1c); color:white; border:none; cursor:pointer; }
        .btn-green { background:linear-gradient(135deg,#22c55e,#15803d); color:white; border:none; cursor:pointer; }
        .modal-bg { display:none; position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); align-items:center; justify-content:center; }
        .modal-bg.active { display:flex; }
        #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:999; padding:12px 24px; border-radius:12px; opacity:0; transition:0.3s; pointer-events:none; }
        #toast.show { opacity:1; }
    </style>
</head>
<body>
<nav class="fixed w-full z-[100] px-6 py-4 glass flex justify-between items-center">
    <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
        <img src="1000014994.png" class="w-10 h-10 rounded-xl" onerror="this.src='https://placehold.co/40x40/ef4444/white?text=W'">
        <span class="text-xl font-black text-white uppercase">WOW<span class="text-red-500">SHOP</span></span>
    </div>
    <div class="flex items-center gap-3">
        <button id="nav-auth-btn" onclick="openModal('auth-modal')" class="btn-red px-4 py-2 rounded-xl text-xs font-bold">เข้าสู่ระบบ</button>
        <button onclick="toggleSidebar()" class="text-white bg-white/10 px-3 py-2 rounded-xl"><i class="fas fa-bars"></i></button>
    </div>
</nav>
<div id="sidebar" class="fixed inset-y-0 right-0 w-64 glass z-[200] p-6 transition-transform translate-x-full">
    <div class="flex justify-between items-center mb-10"><span class="font-black text-red-500 uppercase">MENU</span><button onclick="toggleSidebar()" class="text-2xl text-gray-500">&times;</button></div>
    <nav class="space-y-2">
        <button onclick="changeRoom('home')" class="w-full text-left p-3 hover:bg-white/5 rounded-xl text-white/70 flex items-center gap-3"><i class="fas fa-home"></i> หน้าแรก</button>
        <div id="admin-link" class="hidden"><button onclick="changeRoom('admin')" class="w-full text-left p-3 text-red-500 flex items-center gap-3"><i class="fas fa-user-shield"></i> แอดมิน</button></div>
        <button onclick="location.reload()" class="w-full text-left p-3 text-gray-500 flex items-center gap-3"><i class="fas fa-sync"></i> รีเฟรชเว็บ</button>
    </nav>
</div>
<main id="room-home" class="section-room active pt-24 px-6 max-w-7xl mx-auto"><div id="product-list" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div></main>
<main id="room-admin" class="section-room pt-24 px-6 max-w-4xl mx-auto pb-10">
    <h2 class="text-2xl font-black text-red-500 mb-6 uppercase">Admin Panel</h2>
    <div class="glass p-6 rounded-3xl mb-6">
        <h3 class="font-bold mb-4">เพิ่มสินค้าใหม่</h3>
        <input type="text" id="p-name" placeholder="ชื่อสินค้า" class="w-full p-3 rounded-xl mb-3 bg-white/5 border border-white/10 text-white">
        <input type="number" id="p-price" placeholder="ราคา" class="w-full p-3 rounded-xl mb-3 bg-white/5 border border-white/10 text-white">
        <input type="text" id="p-img" placeholder="ลิงก์รูปภาพ" class="w-full p-3 rounded-xl mb-4 bg-white/5 border border-white/10 text-white">
        <button onclick="addProduct()" class="btn-green w-full py-3 rounded-xl font-bold">บันทึกสินค้า</button>
    </div>
    <div id="admin-list" class="space-y-3"></div>
</main>
<div id="auth-modal" class="modal-bg">
    <div class="glass p-8 rounded-3xl w-full max-w-xs text-center">
        <h2 class="text-xl font-black text-red-500 mb-6 uppercase">Login</h2>
        <input type="text" id="user-in" placeholder="Username" class="w-full p-3 rounded-xl mb-3 bg-white/5 border border-white/10 text-white text-center">
        <input type="password" id="pass-in" placeholder="Password" class="w-full p-3 rounded-xl mb-4 bg-white/5 border border-white/10 text-white text-center">
        <button onclick="login()" class="btn-red w-full py-3 rounded-xl font-bold uppercase text-sm">ตกลง</button>
    </div>
</div>
<div id="toast" class="btn-red text-sm font-bold"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAKCOW7uAJowXhpCUlaW3G",
  authDomain: "wowshop-498d9.firebaseapp.com",
  projectId: "wowshop-498d9",
  storageBucket: "wowshop-498d9.firebasestorage.app",
  messagingSenderId: "534483125591",
  appId: "1:534483125591:web:d0171b503"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let products = [];
db.ref('wowshop_v4/products').on('value', snap => { products = snap.val() || []; render(); });
function render() {
    document.getElementById('product-list').innerHTML = products.map(p => `<div class="glass p-3 rounded-2xl"><img src="${p.img}" class="w-full aspect-square object-cover rounded-xl mb-2"><div class="font-bold text-sm truncate text-white">${p.name}</div><div class="text-red-400 font-black">${p.price}฿</div></div>`).join('');
    document.getElementById('admin-list').innerHTML = products.map((p, i) => `<div class="glass p-4 rounded-xl flex justify-between items-center"><span class="text-white">${p.name}</span><button onclick="deleteProduct(${i})" class="text-red-500"><i class="fas fa-trash"></i></button></div>`).join('');
}
function login() { if(document.getElementById('user-in').value === 'wow11' && document.getElementById('pass-in').value === '123123z') { document.getElementById('admin-link').classList.remove('hidden'); closeModal('auth-modal'); toast('ยินดีต้อนรับ'); } }
function addProduct() { const name=document.getElementById('p-name').value, price=document.getElementById('p-price').value, img=document.getElementById('p-img').value; if(!name||!price) return; products.push({name, price, img}); db.ref('wowshop_v4/products').set(products); toast('เพิ่มแล้ว'); }
function deleteProduct(i) { products.splice(i, 1); db.ref('wowshop_v4/products').set(products); }
function changeRoom(r) { document.querySelectorAll('.section-room').forEach(el => el.classList.remove('active')); document.getElementById('room-' + r).classList.add('active'); toggleSidebar(); }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('translate-x-full'); }
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function toast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
</script>
</body>
</html>
