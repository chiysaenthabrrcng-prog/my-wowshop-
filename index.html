<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOWSHOP - Premium Store 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap');
        :root { --red:#ef4444; --bg:#0b0e14; --surface:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.07); }
        body { font-family:'Kanit',sans-serif; background:var(--bg); color:#e6edf3; margin:0; overflow-x:hidden; }
        .glass { background:var(--surface); backdrop-filter:blur(20px); border:1px solid var(--border); }
        #sidebar { position:fixed; inset-y:0; right:0; width:280px; background:rgba(11,14,20,0.95); backdrop-filter:blur(20px); z-index:200; transform:translateX(100%); transition:0.3s; padding:24px; border-l:1px solid var(--border); }
        #sidebar.active { transform:translateX(0); }
        .section-room { display:none; animation:fadeIn .3s; }
        .section-room.active { display:block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .btn-red { background:linear-gradient(135deg,#ef4444,#b91c1c); color:white; border:none; cursor:pointer; }
        .btn-green { background:linear-gradient(135deg,#22c55e,#15803d); color:white; border:none; cursor:pointer; }
        .modal-bg { display:none; position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); align-items:center; justify-content:center; }
        .modal-bg.active { display:flex; }
        #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:999; padding:12px 24px; border-radius:12px; opacity:0; transition:0.3s; pointer-events:none; }
        #toast.show { opacity:1; }
        .ticker-track { display:inline-flex; animation:ticker 30s linear infinite; white-space:nowrap; }
        @keyframes ticker { from{transform:translateX(0)} to{transform:translateX(-50%)} }
    </style>
</head>
<body>

<nav class="fixed w-full z-[100] px-6 py-4 glass flex justify-between items-center">
    <div class="flex items-center gap-3 cursor-pointer" onclick="changeRoom('home')">
        <img src="1000014994.png" class="w-10 h-10 rounded-xl" onerror="this.src='https://placehold.co/40x40/ef4444/white?text=W'">
        <span class="text-xl font-black text-white uppercase">WOW<span class="text-red-500">SHOP</span></span>
    </div>
    <div class="flex items-center gap-3">
        <div id="user-points-panel" class="hidden glass px-3 py-2 rounded-xl text-red-400 font-bold"><span id="points-val">0.00</span> ฿</div>
        <button id="nav-auth-btn" onclick="openModal('auth-modal')" class="btn-red px-4 py-2 rounded-xl text-xs font-bold uppercase">เข้าสู่ระบบ</button>
        <button onclick="toggleSidebar()" class="text-white bg-white/10 px-3 py-2 rounded-xl"><i class="fas fa-bars"></i></button>
    </div>
</nav>

<div id="sidebar">
    <div class="flex justify-between items-center mb-10 text-red-500 font-black">MENU <button onclick="toggleSidebar()" class="text-2xl text-gray-500">&times;</button></div>
    <nav class="space-y-2">
        <button onclick="changeRoom('home')" class="w-full text-left p-4 hover:bg-white/5 rounded-2xl flex items-center gap-4 text-white/70"><i class="fas fa-home"></i> หน้าแรก</button>
        <button onclick="checkAccess('topup')" class="w-full text-left p-4 hover:bg-white/5 rounded-2xl flex items-center gap-4 text-white/70"><i class="fas fa-wallet"></i> เติมเงิน</button>
        <button onclick="checkAccess('history')" class="w-full text-left p-4 hover:bg-white/5 rounded-2xl flex items-center gap-4 text-white/70"><i class="fas fa-history"></i> ประวัติการซื้อ</button>
        <div id="admin-panel-link" class="hidden border-t border-white/10 pt-4">
            <button onclick="changeRoom('admin')" class="w-full text-left p-4 bg-red-600/10 text-red-500 rounded-2xl flex items-center gap-4 font-black"><i class="fas fa-user-shield"></i> แผงแอดมิน</button>
        </div>
        <button id="logout-btn" onclick="doLogout()" class="hidden w-full text-left p-4 text-gray-500 flex items-center gap-4"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
    </nav>
</div>
<div id="sidebar-overlay" class="hidden fixed inset-0 z-[190] bg-black/50" onclick="toggleSidebar()"></div>

<div class="pt-20">
    <div class="ticker-wrap overflow-hidden py-2 bg-red-500/10 text-red-400 text-xs font-bold border-b border-red-500/20">
        <div class="ticker-track" id="ticker-text">
            <span class="px-10">🔥 ยินดีต้อนรับสู่ WOWSHOP ระบบอัตโนมัติ 24 ชม.</span>
            <span class="px-10">🔥 ยินดีต้อนรับสู่ WOWSHOP ระบบอัตโนมัติ 24 ชม.</span>
        </div>
    </div>
</div>

<main id="room-home" class="section-room active max-w-7xl mx-auto p-4 md:p-6">
    <div id="product-list" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
</main>

<main id="room-admin" class="section-room max-w-4xl mx-auto p-6 pt-10">
    <h2 class="text-2xl font-black text-red-500 mb-6 uppercase">Admin Panel</h2>
    <div class="glass p-6 rounded-3xl mb-8">
        <h3 class="font-bold mb-4">ลงสินค้าใหม่</h3>
        <input type="text" id="pm-name" placeholder="ชื่อสินค้า" class="w-full p-3 rounded-xl mb-3 bg-white/5 border border-white/10 text-white">
        <input type="number" id="pm-price" placeholder="ราคา (฿)" class="w-full p-3 rounded-xl mb-3 bg-white/5 border border-white/10 text-white">
        <input type="text" id="pm-img" placeholder="ลิงก์รูปภาพ" class="w-full p-3 rounded-xl mb-3 bg-white/5 border border-white/10 text-white">
        <textarea id="pm-acc" placeholder="ไอดีที่ขาย (1 บรรทัด = 1 ไอดี)" class="w-full p-3 rounded-xl mb-4 h-24 bg-white/5 border border-white/10 text-white"></textarea>
        <button onclick="saveProduct()" class="btn-green w-full py-3 rounded-xl font-black uppercase">บันทึกสินค้าลงฐานข้อมูล</button>
    </div>
    <div id="admin-product-list" class="space-y-3"></div>
</main>

<main id="room-history" class="section-room max-w-4xl mx-auto p-6 pt-10">
    <h2 class="text-2xl font-black mb-6 uppercase text-white/90">ประวัติการซื้อ</h2>
    <div id="history-content" class="space-y-4"></div>
</main>

<main id="room-topup" class="section-room max-w-lg mx-auto p-6 pt-10 text-center">
    <div class="glass p-8 rounded-[2.5rem]">
        <h2 class="text-2xl font-black mb-6 uppercase">เติมเงิน (อั่งเปา)</h2>
        <input type="text" id="topup-url" placeholder="https://gift.truemoney.com/..." class="w-full p-4 rounded-2xl mb-4 text-center bg-white/5 border border-white/10 text-white">
        <button onclick="handleTopup()" class="btn-red w-full py-4 rounded-2xl font-black">ยืนยันการเติม</button>
    </div>
</main>

<div id="auth-modal" class="modal-bg">
    <div class="glass w-full max-w-sm p-8 rounded-[2.5rem] text-center relative">
        <button onclick="closeModal('auth-modal')" class="absolute top-5 right-6 text-2xl text-gray-500">&times;</button>
        <h2 class="text-2xl font-black text-red-500 mb-6 uppercase">Login</h2>
        <input type="text" id="auth-user" placeholder="Username" class="w-full p-4 rounded-2xl mb-3 text-center bg-white/5 border border-white/10 text-white">
        <input type="password" id="auth-pass" placeholder="Password" class="w-full p-4 rounded-2xl mb-4 text-center bg-white/5 border border-white/10 text-white">
        <button onclick="doLogin()" class="btn-red w-full py-4 rounded-2xl font-black uppercase">เข้าสู่ระบบ</button>
    </div>
</div>

<div id="detail-modal" class="modal-bg">
    <div class="glass w-full max-w-lg p-8 rounded-[2.5rem] relative">
        <button onclick="closeModal('detail-modal')" class="absolute top-5 right-6 text-2xl text-gray-500">&times;</button>
        <img id="det-img" src="" class="w-full aspect-video object-cover rounded-2xl mb-4">
        <h2 id="det-name" class="text-2xl font-black mb-2 uppercase text-white"></h2>
        <div id="det-price" class="text-3xl font-black text-red-500 mb-6"></div>
        <button id="buy-btn" class="btn-red w-full py-4 rounded-2xl font-black uppercase">ยืนยันการสั่งซื้อ</button>
    </div>
</div>

<div id="toast" class="btn-red text-sm font-bold text-white"></div>

<script>
// 1. CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAKCOW7uAJowXhpCUlaW3G",
  authDomain: "wowshop-498d9.firebaseapp.com",
  projectId: "wowshop-498d9",
  storageBucket: "wowshop-498d9.firebasestorage.app",
  messagingSenderId: "534483125591",
  appId: "1:534483125591:web:d0171b503",
  databaseURL: "https://wowshop-498d9-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 2. STATE (Local & Cloud)
let shopData = { products: [], orders: [] };
let currentUser = null; // เก็บในเครื่อง ไม่เก็บใน Firebase เพื่อป้องกันปุ่มหาย

// 3. SYNC FIREBASE
db.ref('wowshop_v5_final').on('value', snap => {
    const data = snap.val();
    if(data) {
        shopData = data;
        renderProducts();
        renderHistory();
    }
});

function saveToCloud() { db.ref('wowshop_v5_final').set(shopData); }

// 4. FUNCTIONS
function doLogin() {
    const u = document.getElementById('auth-user').value;
    const p = document.getElementById('auth-pass').value;
    if(u === 'wow11' && p === '123123z') {
        currentUser = { user: u, points: 999999 };
        showToast('ยินดีต้อนรับแอดมิน');
    } else if(u && p) {
        currentUser = { user: u, points: 0 };
        showToast('เข้าสู่ระบบแล้ว');
    } else {
        return showToast('กรุณากรอกข้อมูล');
    }
    updateAuthUI();
    closeModal('auth-modal');
}

function doLogout() {
    currentUser = null;
    updateAuthUI();
    changeRoom('home');
    showToast('ออกจากระบบแล้ว');
}

function updateAuthUI() {
    const loginBtn = document.getElementById('nav-auth-btn');
    const pointsPanel = document.getElementById('user-points-panel');
    const adminPanel = document.getElementById('admin-panel-link');
    const logoutBtn = document.getElementById('logout-btn');

    if(currentUser) {
        loginBtn.classList.add('hidden');
        pointsPanel.classList.remove('hidden');
        pointsPanel.classList.add('flex');
        document.getElementById('points-val').textContent = currentUser.points.toFixed(2);
        logoutBtn.classList.remove('hidden');
        // เช็คแอดมิน
        if(currentUser.user === 'wow11') {
            adminPanel.classList.remove('hidden');
        } else {
            adminPanel.classList.add('hidden');
        }
    } else {
        loginBtn.classList.remove('hidden');
        pointsPanel.classList.add('hidden');
        adminPanel.classList.add('hidden');
        logoutBtn.classList.add('hidden');
    }
}

function renderProducts() {
    const list = document.getElementById('product-list');
    list.innerHTML = (shopData.products || []).map(p => `
        <div class="product-card glass p-3 rounded-[2rem] relative" onclick="openDetail('${p.id}')">
            ${p.stock <= 0 ? '<div class="sold-overlay">หมดแล้ว</div>' : ''}
            <img src="${p.img}" class="w-full aspect-square object-cover rounded-2xl mb-3">
            <h4 class="text-xs font-bold truncate text-white">${p.name}</h4>
            <span class="text-sm font-black text-red-400">${p.price}฿</span>
        </div>`).join('');

    const adm = document.getElementById('admin-product-list');
    adm.innerHTML = (shopData.products || []).map(p => `
        <div class="glass p-4 rounded-xl flex justify-between items-center">
            <span class="text-white text-sm">${p.name} (${p.stock} ชิ้น)</span>
            <button onclick="deleteProduct('${p.id}')" class="text-red-500"><i class="fas fa-trash"></i></button>
        </div>`).join('');
}

function openDetail(id) {
    const p = shopData.products.find(x => x.id == id);
    if(!p) return;
    document.getElementById('det-img').src = p.img;
    document.getElementById('det-name').textContent = p.name;
    document.getElementById('det-price').textContent = p.price + '฿';
    document.getElementById('buy-btn').onclick = () => doPurchase(p);
    openModal('detail-modal');
}

function saveProduct() {
    const name = document.getElementById('pm-name').value;
    const price = parseInt(document.getElementById('pm-price').value);
    const img = document.getElementById('pm-img').value;
    const accs = document.getElementById('pm-acc').value.split('\n').filter(x => x.trim() !== '');
    if(!name || !price || accs.length === 0) return showToast('ข้อมูลไม่ครบ');
    
    if(!shopData.products) shopData.products = [];
    shopData.products.push({ id: Date.now(), name, price, img, accounts: accs, stock: accs.length });
    saveToCloud();
    showToast('เพิ่มสินค้าแล้ว');
    document.getElementById('pm-name').value = '';
    document.getElementById('pm-price').value = '';
}

function doPurchase(p) {
    if(!currentUser) return showToast('กรุณาล็อกอิน');
    if(currentUser.points < p.price) return showToast('เงินไม่พอ');
    if(p.stock <= 0) return showToast('ของหมด');

    const item = p.accounts.shift();
    p.stock = p.accounts.length;
    currentUser.points -= p.price;
    
    if(!shopData.orders) shopData.orders = [];
    shopData.orders.push({ buyer: currentUser.user, name: p.name, data: item, date: new Date().toLocaleString() });
    
    saveToCloud();
    updateAuthUI();
    closeModal('detail-modal');
    showToast('ซื้อสำเร็จ!');
    changeRoom('history');
}

function renderHistory() {
    if(!currentUser) return;
    const mine = (shopData.orders || []).filter(x => x.buyer === currentUser.user);
    document.getElementById('history-content').innerHTML = mine.reverse().map(h => `
        <div class="glass p-4 rounded-2xl">
            <div class="text-red-400 font-bold">${h.name}</div>
            <div class="text-xs text-white/30 mb-2">${h.date}</div>
            <div class="bg-black/40 p-3 rounded-xl font-mono text-sm text-green-400 border border-white/5">${h.data}</div>
        </div>`).join('');
}

function handleTopup() {
    if(!currentUser) return showToast('กรุณาล็อกอิน');
    const url = document.getElementById('topup-url').value;
    if(!url.includes('gift.truemoney.com')) return showToast('ลิงก์ไม่ถูกต้อง');
    currentUser.points += 500;
    updateAuthUI();
    showToast('เติมเงินสำเร็จ +500฿');
    document.getElementById('topup-url').value = '';
    changeRoom('home');
}

// 5. HELPERS
function toggleSidebar() { 
    document.getElementById('sidebar').classList.toggle('active');
    document.getElementById('sidebar-overlay').classList.toggle('hidden');
}
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function changeRoom(id) {
    document.querySelectorAll('.section-room').forEach(r => r.classList.remove('active'));
    document.getElementById('room-'+id).classList.add('active');
    document.getElementById('sidebar').classList.remove('active');
    document.getElementById('sidebar-overlay').classList.add('hidden');
}
function checkAccess(room) { if(!currentUser) openModal('auth-modal'); else changeRoom(room); }
function showToast(m) { 
    const t = document.getElementById('toast'); t.textContent = m; 
    t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); 
}
function deleteProduct(id) {
    shopData.products = shopData.products.filter(x => x.id != id);
    saveToCloud();
}
</script>
</body>
</html>
